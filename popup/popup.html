<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dark theme for olx</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="sheet">
      <header class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28">
            <rect width="32" height="32" rx="9" fill="#1A1C1D" />
            <path
              d="M22.2 11.4a7.2 7.2 0 1 1-8.8 9.4 6 6 0 0 0 8.8-9.4z"
              fill="#8B9092"
            />
          </svg>
        </div>
        <div class="titles">
          <h1>Dark theme</h1>
          <p>Темна тема для olx.ua</p>
        </div>
        <label class="switch">
          <input id="enabled" type="checkbox" role="switch" />
          <span class="track" aria-hidden="true"></span>
        </label>
      </header>

      <section class="status" id="status">
        <span class="dot"></span>
        <span id="statusText">Checking…</span>
      </section>

      <footer class="footer">
        <a href="https://www.olx.ua/uk/" target="_blank" rel="noreferrer">Open olx.ua</a>
        <span>v1.1.0</span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
